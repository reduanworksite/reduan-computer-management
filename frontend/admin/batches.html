<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batches — Admin Dashboard — REDUAN COMPUTER</title>
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
<div id="shell"></div>
<main class="admin-content" id="page-content">
  <div id="backend-notice"></div>
  <div class="page-head">
    <h2>Batches — ব্যাচ</h2>
    <p>কোর্স নির্বাচন করে তার ব্যাচগুলো দেখুন, নতুন ব্যাচ তৈরি বা সম্পাদনা করুন।</p>
  </div>

  <div class="toolbar">
    <div class="form-group grow">
      <label for="filter-course">কোর্স নির্বাচন করুন</label>
      <select id="filter-course"><option value="">কোর্স নির্বাচন করুন</option></select>
    </div>
    <button class="btn btn-gold" id="btn-new">+ নতুন ব্যাচ</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Batch ID</th><th>Batch Name</th><th>Start Date</th><th>End Date</th><th>Class Days</th>
        <th>Schedule</th><th>Enrolled</th><th>Max</th><th>Seats Left</th><th>Instructor</th><th>Status</th><th>Action</th>
      </tr></thead>
      <tbody id="batches-body"><tr><td colspan="12" class="empty-state">প্রথমে একটি কোর্স নির্বাচন করুন।</td></tr></tbody>
    </table>
  </div>

  <div class="modal-backdrop hidden" id="batch-modal">
    <div class="modal">
      <h3 id="batch-modal-title">নতুন ব্যাচ</h3>
      <form id="batch-form">
        <input type="hidden" id="f-batchId">
        <div class="form-row">
          <div class="form-group"><label>ব্যাচের নাম <span class="req">*</span></label><input type="text" id="f-batchName" placeholder="যেমন: Microsoft Office – Batch 01" required></div>
          <div class="form-group"><label>কোর্স <span class="req">*</span></label><select id="f-courseId" required></select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>শুরুর তারিখ <span class="req">*</span></label><input type="date" id="f-startDate" required></div>
          <div class="form-group"><label>শেষের তারিখ</label><input type="date" id="f-endDate"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>ক্লাসের দিন</label><input type="text" id="f-classDays" placeholder="যেমন: শনি, সোম, বুধ"></div>
          <div class="form-group"><label>ক্লাসের সময়</label><input type="text" id="f-classSchedule" placeholder="যেমন: বিকাল ৪টা – ৫টা"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>সর্বোচ্চ শিক্ষার্থী <span class="req">*</span></label><input type="number" id="f-maxStudents" min="1" step="1" required></div>
          <div class="form-group"><label>শিক্ষকের নাম</label><input type="text" id="f-instructorName"></div>
        </div>
        <div class="form-group"><label>অবস্থা</label>
          <select id="f-status">
            <option value="Upcoming">Upcoming</option>
            <option value="Ongoing">Ongoing</option>
            <option value="Completed">Completed</option>
            <option value="Closed">Closed</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="batch-modal-close">বাতিল</button>
          <button type="submit" class="btn">সংরক্ষণ করুন</button>
        </div>
      </form>
    </div>
  </div>
</main>
<script src="../config.js"></script>
<script src="../api.js"></script>
<script src="admin.js"></script>
<script>
(function () {
  'use strict';
  RC_ADMIN.renderShell('batches', 'Batches');
  var tbody = document.getElementById('batches-body');
  var cache = [];
  var courseSel = document.getElementById('filter-course');

  function renderRows(list) {
    cache = list || [];
    if (!cache.length) { RC_ADMIN.emptyRow(tbody, 12, 'এই কোর্সের কোনো ব্যাচ পাওয়া যায়নি।'); return; }
    tbody.innerHTML = cache.map(function (b) {
      var statusClass = b.status === 'Ongoing' ? 'badge-success' : (b.status === 'Upcoming' ? 'badge-info' : (b.status === 'Completed' ? '' : 'badge-warning'));
      return '<tr>' +
        '<td>' + RC_API.esc(b.batchId) + '</td>' +
        '<td>' + RC_API.esc(b.batchName) + '</td>' +
        '<td>' + RC_API.esc(RC_API.fmtDate(b.startDate)) + '</td>' +
        '<td>' + RC_API.esc(RC_API.fmtDate(b.endDate)) + '</td>' +
        '<td>' + RC_API.esc(b.classDays || '—') + '</td>' +
        '<td>' + RC_API.esc(b.classSchedule || '—') + '</td>' +
        '<td>' + RC_API.esc(b.enrolledStudents !== undefined && b.enrolledStudents !== null ? String(b.enrolledStudents) : '—') + '</td>' +
        '<td>' + RC_API.esc(b.maxStudents !== undefined && b.maxStudents !== null ? String(b.maxStudents) : '—') + '</td>' +
        '<td>' + RC_API.esc(b.seatsLeft !== undefined && b.seatsLeft !== null ? String(b.seatsLeft) : '—') + '</td>' +
        '<td>' + RC_API.esc(b.instructorName || '—') + '</td>' +
        '<td><span class="badge ' + statusClass + '">' + RC_API.esc(b.status || '—') + '</span></td>' +
        '<td><button class="btn btn-sm btn-outline" data-edit="' + RC_API.esc(b.batchId) + '">Edit</button></td>' +
      '</tr>';
    }).join('');
  }

  function loadBatches() {
    var courseId = courseSel.value;
    if (!courseId) { RC_ADMIN.emptyRow(tbody, 12, 'প্রথমে একটি কোর্স নির্বাচন করুন।'); return; }
    RC_ADMIN.setLoading(tbody, true);
    /* Admin action getBatches — সব অবস্থার ব্যাচ, পূর্ণ ফিল্ডসহ;
     * enrolledStudents Students শিট থেকে live গোনা হয়। */
    RC_API.call('getBatches', { courseId: courseId }).then(function (res) {
      if (!res.ok) { RC_ADMIN.toast(res.error || 'ব্যাচের তালিকা আনা যায়নি।', 'error'); RC_ADMIN.emptyRow(tbody, 12); return; }
      renderRows(res.data || []);
    });
  }

  courseSel.addEventListener('change', loadBatches);

  tbody.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-edit]');
    if (!btn) return;
    var b = cache.find(function (x) { return x.batchId === btn.getAttribute('data-edit'); });
    if (b) openForm(b);
  });

  var modal = document.getElementById('batch-modal');
  var form = document.getElementById('batch-form');
  var formCourse = document.getElementById('f-courseId');

  function openForm(b) {
    form.reset();
    document.getElementById('f-batchId').value = b ? b.batchId : '';
    document.getElementById('batch-modal-title').textContent = b ? 'ব্যাচ সম্পাদনা — ' + b.batchId : 'নতুন ব্যাচ';
    RC_ADMIN.loadCourseOptions(formCourse).then(function () {
      if (b) formCourse.value = courseSel.value || '';
      else if (courseSel.value) formCourse.value = courseSel.value;
    });
    if (b) {
      document.getElementById('f-batchName').value = b.batchName || '';
      document.getElementById('f-startDate').value = b.startDate ? RC_API.fmtDate(b.startDate) : '';
      document.getElementById('f-endDate').value = b.endDate ? RC_API.fmtDate(b.endDate) : '';
      document.getElementById('f-classDays').value = b.classDays || '';
      document.getElementById('f-classSchedule').value = b.classSchedule || '';
      document.getElementById('f-maxStudents').value = (b.maxStudents !== undefined && b.maxStudents !== null) ? b.maxStudents : '';
      document.getElementById('f-instructorName').value = b.instructorName || '';
      document.getElementById('f-status').value = b.status || 'Upcoming';
    }
    modal.classList.remove('hidden');
  }
  document.getElementById('btn-new').addEventListener('click', function () { openForm(null); });
  document.getElementById('batch-modal-close').addEventListener('click', function () { modal.classList.add('hidden'); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = document.getElementById('f-batchId').value;
    var maxStudents = Number(document.getElementById('f-maxStudents').value);
    if (id) {
      var upd = {
        batchId: id,
        batchName: document.getElementById('f-batchName').value.trim(),
        startDate: document.getElementById('f-startDate').value,
        endDate: document.getElementById('f-endDate').value || undefined,
        classDays: document.getElementById('f-classDays').value.trim(),
        classSchedule: document.getElementById('f-classSchedule').value.trim(),
        instructorName: document.getElementById('f-instructorName').value.trim(),
        status: document.getElementById('f-status').value
      };
      if (!isNaN(maxStudents) && maxStudents > 0) upd.maxStudents = maxStudents;
      RC_API.call('updateBatch', upd).then(function (res) {
        if (!res.ok) { RC_ADMIN.toast(res.error || 'ব্যাচ আপডেট করা যায়নি।', 'error'); return; }
        RC_ADMIN.toast('ব্যাচ আপডেট হয়েছে।', 'success');
        modal.classList.add('hidden');
        loadBatches();
      });
    } else {
      var payload = {
        batchName: document.getElementById('f-batchName').value.trim(),
        courseId: formCourse.value,
        startDate: document.getElementById('f-startDate').value,
        endDate: document.getElementById('f-endDate').value || undefined,
        classDays: document.getElementById('f-classDays').value.trim(),
        classSchedule: document.getElementById('f-classSchedule').value.trim(),
        maxStudents: maxStudents,
        instructorName: document.getElementById('f-instructorName').value.trim(),
        status: document.getElementById('f-status').value
      };
      RC_API.call('createBatch', payload).then(function (res) {
        if (!res.ok) { RC_ADMIN.toast(res.error || 'ব্যাচ তৈরি করা যায়নি।', 'error'); return; }
        RC_ADMIN.toast('নতুন ব্যাচ তৈরি হয়েছে — Batch ID: ' + (res.data && res.data.batchId ? res.data.batchId : ''), 'success');
        modal.classList.add('hidden');
        loadBatches();
      });
    }
  });

  RC_ADMIN.guardPage().then(function (ok) {
    if (!ok) return;
    RC_ADMIN.loadCourseOptions(courseSel);
  });
})();
</script>
</body>
</html>
